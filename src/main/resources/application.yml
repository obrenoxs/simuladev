server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/simuladev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:

        smtp:
          auth: true
          starttls:
            enable: true

app:
  base-url: http://localhost:8080
  mail-from: ${MAIL_FROM}
